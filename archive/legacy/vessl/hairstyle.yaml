# 헤어스타일 변경을 GPU에서 실행하는 VESSL Run 명세.
#
# 이 프로젝트의 성능 병목은 전부 계산 장비에 있다. 같은 코드가 GPU에서는 프레임당 수 초,
# 그래픽 가속이 없는 노트북에서는 2~5분 걸린다. 코드는 장치를 자동으로 감지하므로
# 여기서 따로 지정할 것은 없다.
#
# 실행:  vessl run -f vessl/hairstyle.yaml
#
# 먼저 준비할 것:
#   1. HairFastGAN 가중치 7.3GB를 VESSL 스토리지에 한 번 올려둔다. 실행할 때마다 받으면
#      매번 25분이 낭비된다.
#   2. 처리할 프레임과 참조 사진을 스토리지에 올린다.
#   3. 아래 import/export의 스토리지 경로를 실제 경로로 바꾼다.

name: hairstyle-transfer
description: HairFastGAN으로 얼굴 사진 묶음의 헤어스타일을 변경한다

# CUDA 툴체인이 포함된 이미지를 쓴다. StyleGAN2의 CUDA 커널을 컴파일할 수 있으면 빠른
# 경로를 타고, 실패하면 patch_hairfastgan.py가 넣어둔 순수 PyTorch 경로로 넘어간다.
image: quay.io/vessl-ai/torch:2.3.1-cuda12.1-r5

resources:
  preset: gpu-l4-small

import:
  /root/code: git://github.com/JAEEUN0129/CV_Project
  # 아래 세 줄은 실제 스토리지 경로로 바꿀 것
  /root/weights: vessl-dataset://hairfastgan-weights
  /root/faces: vessl-dataset://input-frames
  /root/reference: vessl-dataset://hairstyle-reference

run:
  - workdir: /root/code
    command: |
      set -e

      # 모델 코드는 용량 때문에 저장소에 포함하지 않는다. 받은 뒤 이 프로젝트에 맞게 고친다.
      git clone --depth 1 https://github.com/AIRI-Institute/HairFastGAN external/HairFastGAN
      python jaeeun/patch_hairfastgan.py

      # 모델 코드가 가중치를 자기 폴더 안에서 상대 경로로 찾는다.
      ln -s /root/weights/pretrained_models external/HairFastGAN/pretrained_models

      pip install -r jaeeun/requirements-hair.txt

      # 모델이 상대 경로를 쓰므로 저장소 폴더에서 실행해야 한다.
      cd external/HairFastGAN
      python /root/code/jaeeun/hair_runner.py \
        --faces /root/faces \
        --reference /root/reference/style.png \
        --output /root/outputs \
        --repo /root/code/external/HairFastGAN \
        --weights /root/weights/pretrained_models

export:
  /root/outputs: vessl-dataset://hairstyle-results
